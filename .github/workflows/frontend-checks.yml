name: Frontend checks

on:
  pull_request:
    branches: [main, 'fix/**', 'feature/**', 'release/**']
  push:
    branches:
      - main
      - "fix/**"
      - "audit/**"
      - "feature/**"
      - "release/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check customer, admin and shared JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name, output in [("index.html", "/tmp/ai-manager-inline.js"), ("admin.html", "/tmp/ai-manager-admin.js")]:
              html = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.S | re.I)
              inline = [script for script in scripts if script.strip()]
              if not inline:
                  raise SystemExit(f"No inline application script found in {name}")
              Path(output).write_text("\n".join(inline), encoding="utf-8")
          PY
          node --check /tmp/ai-manager-inline.js
          node --check /tmp/ai-manager-admin.js
          node --check ui-language.js
      - name: Run frontend contract tests
        run: node --test frontend-tests/*.test.cjs
