name: Frontend checks

on:
  pull_request:
    branches: [main, 'fix/**', 'feature/**']
  push:
    branches:
      - "fix/**"
      - "audit/**"
      - "feature/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline application script found")
          Path("/tmp/ai-manager-inline.js").write_text("\n".join(inline), encoding="utf-8")
          admin = Path("admin.html").read_text(encoding="utf-8")
          admin_scripts = re.findall(r"<script\\b[^>]*>(.*?)</script\\s*>", admin, flags=re.S | re.I)
          Path("/tmp/ai-manager-admin.js").write_text("\\n".join(admin_scripts), encoding="utf-8")
          PY
          node --check /tmp/ai-manager-inline.js
          node --check /tmp/ai-manager-admin.js
      - name: Run frontend contract tests
        run: node --test frontend-tests/*.test.cjs
