name: Part search regression tests

on:
  push:
    branches: [fix/2.4.37-universal-part-search]
    paths:
      - "automotive-language.js"
      - "index.html"
      - "frontend-tests/**"
      - "backend/**"
      - ".github/workflows/part-search-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "automotive-language.js"
      - "index.html"
      - "frontend-tests/**"
      - "backend/**"

jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run frontend regression tests
        run: node --test frontend-tests/*.test.cjs

  tradesoft-adapter-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install adapter test dependency
        run: python -m pip install "httpx>=0.27,<1"
      - name: Run TradeSoft adapter tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_tradesoft_adapter.py" -v
