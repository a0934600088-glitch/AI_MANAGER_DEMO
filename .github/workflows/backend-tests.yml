name: Backend tests

on:
  pull_request:
    branches: [main, 'fix/**', 'feature/**']
  push:
    branches:
      - main
      - "fix/**"
      - "audit/**"
      - "feature/**"

jobs:
  unittest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_manager
          POSTGRES_PASSWORD: ai_manager_test
          POSTGRES_DB: ai_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_manager -d ai_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ai_manager:ai_manager_test@localhost:5432/ai_manager_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "pydantic>=2,<3" "psycopg[binary]>=3.2,<4"
      - name: Compile backend
        run: python -m compileall -q app
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
