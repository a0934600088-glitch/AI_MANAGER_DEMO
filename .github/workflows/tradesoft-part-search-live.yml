name: TradeSoft live part-name search

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/tradesoft-part-search-live.yml"
  workflow_dispatch:

jobs:
  part-name-search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Railway 2.4.18 to become healthy
        env:
          API_BASE: https://ai-manager-api-production.up.railway.app
        run: |
          for attempt in $(seq 1 60); do
            payload=$(curl -fsS "$API_BASE/health" || true)
            version=$(printf '%s' "$payload" | node -pe "try { JSON.parse(require('fs').readFileSync(0,'utf8')).version } catch(e) { '' }")
            echo "Backend version: ${version:-not ready}"
            if [ "$version" = "2.4.18" ]; then exit 0; fi
            sleep 5
          done
          echo "Railway did not report backend version 2.4.18 within 5 minutes"
          exit 1

      - name: Verify Russian part requests against live TradeSoft
        env:
          API_BASE: https://ai-manager-api-production.up.railway.app
        run: |
          node <<'NODE'
          const base = process.env.API_BASE;
          const vin = 'WVWZZZAUZJP594600';
          const queries = ['тормозные колодки', 'тормозные диски', 'передние амортизаторы'];
          async function post(body, label) {
            const response = await fetch(base + '/api/catalog/v1/lookup', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(45000)
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(label + ': HTTP ' + response.status + ' ' + JSON.stringify(payload.detail || payload));
            if (payload.status !== 'success' || payload.is_demo_data === true) throw new Error(label + ': provider did not return a real successful result');
            return payload.result || {};
          }
          function rows(value) {
            if (Array.isArray(value)) return value;
            if (!value || typeof value !== 'object') return [];
            for (const key of ['list','items','data','results','schemas']) {
              if (Array.isArray(value[key])) return value[key];
            }
            return [];
          }
          (async () => {
            for (const query of queries) {
              const result = await post({vin, mode:'parts', q:query, lang:'ru'}, query + ' schema search');
              const schemas = rows(result.schemas);
              if (!schemas.length) throw new Error(query + ': TradeSoft returned no original schemas');
              const schema = schemas.find(item => item.groupId ?? item.group_id ?? item.groupID ?? item.group?.id ?? item.id) || schemas[0];
              const envelopeGroup = result.schemas?.group || {};
              const candidates = [
                schema.groupId, schema.group_id, schema.groupID, schema.group?.id, schema.id,
                envelopeGroup.groupId, envelopeGroup.group_id, envelopeGroup.id
              ].filter((value, index, all) => value !== undefined && value !== null && String(value).trim() && all.findIndex(x => String(x) === String(value)) === index);
              let payload = null, parts = [], positions = [], groupId = null;
              for (const candidate of candidates) {
                try {
                  const partsResult = await post({vin, mode:'parts', group_id:candidate, lang:'ru'}, query + ' parts2');
                  const candidatePayload = partsResult.parts || partsResult;
                  const partGroups = rows(candidatePayload.partGroups || candidatePayload.part_groups);
                  const candidateParts = partGroups.flatMap(group => rows(group.parts));
                  const candidatePositions = rows(candidatePayload.positions);
                  console.log('parts2 candidate=' + String(candidate) + ' keys=' + Object.keys(candidatePayload).join(',') +
                    ' partGroups=' + partGroups.length + ' positions=' + candidatePositions.length +
                    ' image=' + Boolean(candidatePayload.img));
                  if (candidatePayload.img && candidatePositions.length && candidateParts.length) {
                    payload = candidatePayload; parts = candidateParts; positions = candidatePositions; groupId = candidate; break;
                  }
                } catch (error) {
                  console.log('parts2 candidate=' + String(candidate) + ' rejected=' + error.message.slice(0,300));
                }
              }
              if (!payload) {
                console.error('TradeSoft schemas envelope diagnostic: ' + JSON.stringify({
                  query, envelopeGroup, schema, schemaKeys:Object.keys(schema), candidates
                }).slice(0,7000));
                throw new Error(query + ': no candidate schema/group ID returned a complete original parts2 diagram');
              }
              const oeCount = parts.filter(part =>
                ['number','oeNumber','oe_number','oemNumber','oem_number','partNumber','part_number']
                  .some(key => part[key] !== undefined && part[key] !== null && String(part[key]).trim())
              ).length;
              if (!oeCount) throw new Error(query + ': no OE numbers returned for the selected diagram');
              console.log('LIVE TradeSoft OK: ' + query + '; schemas=' + schemas.length +
                '; groupId=' + groupId + '; parts=' + parts.length +
                '; positions=' + positions.length + '; OE=' + oeCount);
            }
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
