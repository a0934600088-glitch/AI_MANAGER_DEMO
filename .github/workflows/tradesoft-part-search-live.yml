name: TradeSoft live part-name search

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/tradesoft-part-search-live.yml"
  workflow_dispatch:

jobs:
  part-name-search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Railway 2.4.20 to become healthy
        env:
          API_BASE: https://ai-manager-api-production.up.railway.app
        run: |
          for attempt in $(seq 1 60); do
            payload=$(curl -fsS "$API_BASE/health" || true)
            version=$(printf '%s' "$payload" | node -pe "try { JSON.parse(require('fs').readFileSync(0,'utf8')).version } catch(e) { '' }")
            echo "Backend version: ${version:-not ready}"
            if [ "$version" = "2.4.20" ]; then exit 0; fi
            sleep 5
          done
          echo "Railway did not report backend version 2.4.20 within 5 minutes"
          exit 1

      - name: Verify Russian part requests against live TradeSoft
        env:
          API_BASE: https://ai-manager-api-production.up.railway.app
        run: |
          node <<'NODE'
          const base = process.env.API_BASE;
          const vin = 'WVWZZZAUZJP594600';
          const queries = [
            {q:'тормозные колодки | колодки тормозные | тормозная колодка | brake pads | brake pad', match:'колод'},
            {q:'тормозные диски | тормозной диск | диск тормозной | brake disc | brake rotor', match:'диск'},
            {q:'передние амортизаторы | амортизатор | стойка амортизатора | shock absorber | damper | strut', match:'амортиз'}
          ];
          async function post(body, label) {
            const response = await fetch(base + '/api/catalog/v1/lookup', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(60000)
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(label + ': HTTP ' + response.status + ' ' + JSON.stringify(payload.detail || payload));
            if (payload.status !== 'success' || payload.is_demo_data === true) throw new Error(label + ': provider did not return a real successful result');
            return payload.result || {};
          }
          function rows(value) {
            if (Array.isArray(value)) return value;
            if (!value || typeof value !== 'object') return [];
            for (const key of ['list','items','data','results','schemas']) {
              if (Array.isArray(value[key])) return value[key];
            }
            return [];
          }
          (async () => {
            for (const item of queries) {
              const search = await post({vin, mode:'parts', q:item.q, lang:'ru'}, item.q + ' schema search');
              const schemas = rows(search.schemas);
              const schema = schemas.find(s =>
                (Array.isArray(s.partNames) && s.partNames.some(p => String(p?.name || '').toLowerCase().includes(item.match))) ||
                String(s.name || '').toLowerCase().includes(item.match)
              );
              if (!schema) throw new Error(item.q + ': no original TradeSoft schema matched the requested part name');
              const schemaId = schema.groupId ?? schema.group_id ?? schema.groupID ?? schema.id;
              if (schemaId == null) throw new Error(item.q + ': matching schema has no groupId');
              const selected = await post({vin, mode:'parts', q:item.q, group_id:schemaId, lang:'ru'}, item.q + ' parts2');
              const diagram = selected.parts || {};
              const groups = rows(diagram.partGroups || diagram.part_groups);
              const parts = Array.isArray(diagram.parts) ? diagram.parts : groups.flatMap(group => rows(group.parts));
              const positions = rows(diagram.positions);
              const normalizeImage = value => { const text=String(value||''); return (text.startsWith('//')?'https:'+text:text).replace(/^http:/,'https:').split('?')[0]; };
              if (!diagram.img || !positions.length || !parts.length) {
                throw new Error(item.q + ': no complete original TradeSoft diagram, positions and parts');
              }
              if (schema.img && normalizeImage(schema.img) !== normalizeImage(diagram.img)) {
                throw new Error(item.q + ': selected parts2 diagram does not match the chosen schema image');
              }
              const oeCount = parts.filter(part =>
                ['number','oeNumber','oe_number','oemNumber','oem_number','partNumber','part_number']
                  .some(key => part[key] !== undefined && part[key] !== null && String(part[key]).trim())
              ).length;
              if (!oeCount) throw new Error(item.q + ': no OE numbers returned for the selected diagram');
              console.log('LIVE TradeSoft OK: ' + item.q.split('|')[0].trim() +
                '; schemas=' + schemas.length + '; parts=' + parts.length +
                '; positions=' + positions.length + '; OE=' + oeCount +
                '; resolvedGroupId=' + selected.resolvedGroupId);
            }
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
